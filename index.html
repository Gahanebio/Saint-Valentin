<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être ma Valentine ? ❤</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-fast': 'pulse 1s infinite'
                    }
                }
            }
        }
    </script>

    <style>
        /* ===== IMAGE DE FOND ===== */
        body {
            background-image: url("https://images.unsplash.com/photo-1518199266791-5375a83190b7");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Légère couche sombre pour lisibilité */
        .overlay {
            background: rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

<body class="min-h-screen flex justify-center items-center font-sans text-white">

    <!-- OVERLAY -->
    <div class="overlay fixed inset-0"></div>

    <!-- ================= POPUP PRÉNOM ================= -->
    <div id="namePopup" class="fixed inset-0 flex items-center justify-center z-50">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-8 max-w-sm w-11/12 text-center shadow-2xl animate-pulse">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Surprise !!! 🙃
            </h2>

            <input
                type="text"
                id="userName"
                placeholder="Ton prénom s'il te plaît..."
                class="w-full px-6 py-4 text-lg text-gray-800 border-2 border-pink-200 rounded-2xl focus:border-pink-400 focus:outline-none text-center font-semibold mb-6">

            <button onclick="startValentine()"
                class="px-8 py-4 bg-gradient-to-r from-pink-400 to-red-400 text-white rounded-2xl font-bold text-lg hover:scale-105 transition-all">
                C'est parti !
            </button>
        </div>
    </div>

    <!-- ================= CONTENU PRINCIPAL ================= -->
    <div class="relative z-10 text-center">

        <h1 id="dynamicTitle"
            class="text-3xl md:text-5xl font-bold mb-12 animate-pulse hidden drop-shadow-2xl">
            <span id="nameDisplay"></span>, veux-tu être ma Valentine ? 😍❤💍
        </h1>

        <button id="oui"
            class="fixed px-8 py-6 text-xl font-bold bg-gradient-to-r from-pink-400 to-red-400 rounded-full shadow-2xl hover:scale-125 transition-all z-20 hidden">
            Oui 😍
        </button>

        <button id="non"
            class="fixed px-8 py-6 text-xl font-bold bg-gray-200 text-gray-800 rounded-full shadow-xl hover:scale-90 transition-all z-10 hidden">
            Non 🙄
        </button>
    </div>

    <!-- ================= SUCCÈS ================= -->
    <div id="success" class="fixed inset-0 bg-black/80 flex flex-col justify-center items-center z-40 hidden">
        <img src="https://media.giphy.com/media/u8u0R51ND9L2/giphy.gif"
             class="w-72 h-72 mb-8 animate-bounce">

        <h2 class="text-4xl font-black bg-gradient-to-r from-pink-300 to-red-500 bg-clip-text text-transparent animate-pulse">
            Woooww Superrr ! 💕💕
        </h2>
    </div>

    <!-- ================= COPYRIGHT ================= -->
    <footer class="fixed bottom-2 right-3 text-xs md:text-sm text-white/70 hover:text-white transition-all z-50">
        © <span id="year"></span> • Créé avec ❤ par <span class="font-semibold">Gahane</span>
    </footer>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const namePopup = document.getElementById('namePopup');
        const dynamicTitle = document.getElementById('dynamicTitle');
        const nameDisplay = document.getElementById('nameDisplay');
        const userNameInput = document.getElementById('userName');
        const ouiBtn = document.getElementById('oui');
        const nonBtn = document.getElementById('non');
        const success = document.getElementById('success');

        document.getElementById('year').textContent = new Date().getFullYear();

        window.addEventListener('load', () => userNameInput.focus());

        function startValentine() {
            const name = userNameInput.value.trim();
            if (!name) {
                alert("Entre ton prénom stp 💙");
                return;
            }

            namePopup.style.display = "none";
            nameDisplay.textContent = name;
            dynamicTitle.classList.remove("hidden");
            ouiBtn.classList.remove("hidden");
            nonBtn.classList.remove("hidden");

            ouiBtn.style.left = "40%";
            ouiBtn.style.top = "60%";
            nonBtn.style.left = "55%";
            nonBtn.style.top = "60%";
        }

        function moveNonButton() {
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 150;
            nonBtn.style.left = Math.random() * maxX + "px";
            nonBtn.style.top = Math.random() * maxY + "px";
        }

        function growOuiButton() {
            const scale = parseFloat(ouiBtn.dataset.scale || 1);
            if (scale < 2) {
                ouiBtn.dataset.scale = scale + 0.2;
                ouiBtn.style.transform = `scale(${scale + 0.2})`;
            }
        }

        nonBtn.addEventListener("mouseenter", moveNonButton);
        nonBtn.addEventListener("click", moveNonButton);

        ouiBtn.addEventListener("mouseenter", growOuiButton);
        ouiBtn.addEventListener("touchstart", growOuiButton);

        ouiBtn.addEventListener("click", () => {
            document.querySelectorAll("button").forEach(b => b.style.display = "none");
            dynamicTitle.style.display = "none";
            success.classList.remove("hidden");
        });

        userNameInput.addEventListener("keypress", e => {
            if (e.key === "Enter") startValentine();
        });
    </script>

</body>
</html>
